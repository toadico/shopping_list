services:
  shopping-list:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shared-shopping-list
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: "production"
      PORT: "3000"
      HOST: "0.0.0.0"
      DB_PATH: "/app/data/shopping-list.db"
      RATE_LIMIT_MAX: "300"
    volumes:
      - shopping_list_data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  shopping_list_data:
    driver: local
